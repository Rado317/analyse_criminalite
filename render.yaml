databases:
  - name: criminalite-db
    databaseName: criminalite
    user: criminalite

services:
  - type: web
    name: criminalite-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m scripts.prepare_artifacts
    startCommand: python -m scripts.init_db --force && uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: criminalite-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "*"
